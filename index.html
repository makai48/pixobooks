<!doctype html>
<html lang="en" data-theme="light" data-skin="papier">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="shortcut icon" type="image/png" href="/pwa-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes" />
    <title>PixoBooks — All-in-One Business POS</title>
    <meta name="description" content="PixoBooks is an all-in-one POS and business management app for growing businesses. Sales, inventory, employees, customers, and financial insights — with real-time sync across devices." />
    <meta name="keywords" content="business POS, business management, inventory, small business software, invoice, receipt, financial management" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1b2a4e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PixoBooks" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.pixoprints.com/" />
    <meta property="og:title" content="PixoBooks — All-in-One Business POS" />
    <meta property="og:description" content="Run your business with one beautifully simple app: sales, inventory, customers, employees, and financial insights — synced live." />
    <meta property="og:image" content="https://app.pixoprints.com/pwa-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:site_name" content="PixoBooks" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PixoBooks — All-in-One Business POS" />
    <meta name="twitter:description" content="A friendly POS and business hub for growing businesses." />
    <meta name="twitter:image" content="https://app.pixoprints.com/pwa-512.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "PixoBooks",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "All-in-one POS and business management app for growing businesses."
    }
    </script>

    <script>
      try {
        const saved = JSON.parse(localStorage.getItem("pixobooks.theme") || "null");
        if (saved) {
          document.documentElement.dataset.theme = saved.mode === "dark" ? "dark" : "light";
          document.documentElement.dataset.skin = saved.preset || "papier";
        }
      } catch {
        /* first run or storage blocked */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Fraunces:wght@600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
