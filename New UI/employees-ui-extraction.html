function cycleAttendance(cell) {
  const statuses = ['present', 'halfday', 'leave', 'holiday', 'absent'];
  const statusMeta = { present: { label: 'P', color: 'status-present' }, halfday: { label: 'H', color: 'status-halfday' }, leave: { label: 'L', color: 'status-leave' }, holiday: { label: 'H', color: 'status-holiday' }, absent: { label: 'A', color: 'status-absent' } };
  const current = cell.className.match(/status-(\w+)/);
  const currentStatus = current ? current[1] : null;
  const idx = currentStatus ? statuses.indexOf(currentStatus) : -1;
  const next = statuses[(idx + 1) % statuses.length];
  const meta = statusMeta[next];
  cell.className = `day-cell in-month ${meta.color}`;
  cell.innerHTML = `<span class="day-num">${cell.querySelector('.day-num').textContent}</span><span class="day-status">${meta.label}</span>`;
}
