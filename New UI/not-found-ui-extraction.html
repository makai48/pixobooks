<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixoBooks — 404 UI/UX Extraction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pixobooks-shared.css">
<style>
.nf-root { min-height: 100vh; background: var(--paper-canvas); display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
.nf-card { padding: 40px; text-align: center; max-width: 28rem; }
.nf-icon { width: 56px; height: 56px; border-radius: 50%; background: rgba(224,51,128,0.1); display: flex; align-items: center; justify-content: center; margin: 0 auto; }
.nf-icon svg { width: 24px; height: 24px; color: var(--reg-magenta); }
.nf-eyebrow { font-family: var(--font-mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-mute); margin-top: 24px; }
.nf-title { font-family: var(--font-sans); font-weight: 700; font-size: 1.875rem; margin-top: 4px; }
.nf-desc { color: var(--ink-mute); margin-top: 8px; font-size: 14px; }
.nf-btn { margin-top: 24px; display: inline-flex; align-items: center; gap: 8px; }
.nf-btn svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<div class="nf-root">
  <div class="paper-card nf-card">
    <div class="nf-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20a1 1 0 0 1-.707-.293l-6-6a1 1 0 0 1 0-1.414l6-6a1 1 0 0 1 1.414 0l6 6a1 1 0 0 1 0 1.414l-6 6A1 1 0 0 1 9 20z"/><path d="m12 8 4 4"/><path d="m16 8-4 4"/></svg>
    </div>
    <div class="nf-eyebrow">404 · Page not found</div>
    <h1 class="nf-title">Off the press</h1>
    <p class="nf-desc">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="btn btn-primary nf-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      Back to Sales
    </a>
  </div>
</div>
</body>
</html>
